    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <main>
        <!-- Aquí va el contenido ÚNICO de cada página -->
        <section class="contenido-texto">
    <h1>Formulario de Inscripción</h1>
    <p>Completa tus datos y nos pondremos en contacto para confirmar tu cupo.</p>
    
    <form action="#" method="POST" class="formulario-inscripcion">
        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" name="email" required>

        <label for="telefono">Teléfono:</label>
        <input type="tel" id="telefono" name="telefono">

        <label for="taller">Taller al que deseas inscribirte:</label>
        <select id="taller" name="taller">
            <option value="principiantes">Tai Chi Principiantes</option>
            <option value="intermedio">Tai Chi Intermedio</option>
            <option value="chikung">Chi Kung</option>
        </select>

        <label for="mensaje">¿Algo que quieras contarnos?</label>
        <textarea id="mensaje" name="mensaje" rows="4"></textarea>

        <button type="submit" class="btn-grande">Enviar inscripción</button>
    </form>
</section>
    </main>
